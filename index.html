<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure File Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 760px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; }
    h1, h2 { margin-top: 0; font-size: 1.35rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    input[type="email"], input[type="password"] {
      width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem;
    }
    button {
      background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 8px;
      font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: var(--danger); padding: 6px 12px; font-size: 0.85rem; }
    .btn-download { padding: 6px 12px; font-size: 0.85rem; margin-right: 6px; }
    .upload-box {
      border: 2px dashed #cbd5e1; border-radius: 10px; padding: 28px; text-align: center;
      background: #f8fafc; margin-bottom: 16px;
    }
    .status { margin-top: 10px; font-size: 0.9rem; color: var(--muted); }
    .error { color: var(--danger); font-size: 0.9rem; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    th { color: var(--muted); font-weight: 600; }
    .hidden { display: none; }
    @media (max-width: 600px) {
      td:nth-child(2), th:nth-child(2) { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LOGIN SCREEN -->
    <div id="auth-card" class="card" style="max-width: 420px; margin: 60px auto;">
      <h1>Personal Cloud Portal</h1>
      <p style="color: var(--muted); font-size: 0.95rem;">Sign in to upload or download your files.</p>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
        <button type="submit" style="width: 100%;">Sign In</button>
        <div id="auth-error" class="error"></div>
      </form>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="app-card" class="hidden">
      <div class="card">
        <div class="header">
          <div>
            <h1 style="margin-bottom: 4px;">My Files</h1>
            <span id="user-email" style="color: var(--muted); font-size: 0.88rem;"></span>
          </div>
          <button id="logout-btn" class="btn-secondary">Sign Out</button>
        </div>

        <div class="upload-box">
          <input type="file" id="file-input" multiple style="margin-bottom: 12px;" />
          <br />
          <button id="upload-btn">Upload Selected Files</button>
          <div id="upload-status" class="status">Supports any file format (images, ZIP, CSV, PDF, binaries, etc.)</div>
        </div>

        <table>
          <thead>
            <tr>
              <th>File Name</th>
              <th>Size</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="file-list">
            <tr><td colspan="3" style="color: var(--muted);">Loading files...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // REPLACE THESE TWO VALUES WITH YOUR SUPABASE CREDENTIALS
    // =========================================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const BUCKET_NAME = 'vault';
    // =========================================================

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authCard = document.getElementById('auth-card');
    const appCard = document.getElementById('app-card');
    const loginForm = document.getElementById('login-form');
    const authError = document.getElementById('auth-error');
    const userEmailEl = document.getElementById('user-email');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadStatus = document.getElementById('upload-status');
    const fileList = document.getElementById('file-list');

    let currentUser = null;

    // Check active session on page load
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      handleSession(session);
      sb.auth.onAuthStateChange((_event, session) => handleSession(session));
    }

    function handleSession(session) {
      if (session && session.user) {
        currentUser = session.user;
        userEmailEl.textContent = currentUser.email;
        authCard.classList.add('hidden');
        appCard.classList.remove('hidden');
        loadFiles();
      } else {
        currentUser = null;
        authCard.classList.remove('hidden');
        appCard.classList.add('hidden');
      }
    }

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) authError.textContent = error.message;
    });

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
    });

    // Upload Files
    uploadBtn.addEventListener('click', async () => {
      const files = fileInput.files;
      if (!files.length) {
        uploadStatus.textContent = 'Please select at least one file first.';
        return;
      }
      uploadBtn.disabled = true;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        uploadStatus.textContent = `Uploading (${i + 1}/${files.length}): ${file.name}...`;
        const filePath = `${currentUser.id}/${file.name}`;
        const { error } = await sb.storage.from(BUCKET_NAME).upload(filePath, file, {
          upsert: true
        });
        if (error) {
          uploadStatus.textContent = `Error uploading ${file.name}: ${error.message}`;
          uploadBtn.disabled = false;
          return;
        }
      }
      uploadStatus.textContent = 'Upload complete!';
      fileInput.value = '';
      uploadBtn.disabled = false;
      loadFiles();
    });

    // List Files
    async function loadFiles() {
      fileList.innerHTML = '<tr><td colspan="3" style="color: var(--muted);">Loading...</td></tr>';
      const { data, error } = await sb.storage.from(BUCKET_NAME).list(currentUser.id, {
        limit: 200,
        sortBy: { column: 'created_at', order: 'desc' }
      });

      if (error) {
        fileList.innerHTML = `<tr><td colspan="3" class="error">${error.message}</td></tr>`;
        return;
      }

      const validFiles = (data || []).filter(f => f.name !== '.emptyFolderPlaceholder');
      if (!validFiles.length) {
        fileList.innerHTML = '<tr><td colspan="3" style="color: var(--muted);">No files uploaded yet.</td></tr>';
        return;
      }

      fileList.innerHTML = '';
      validFiles.forEach(file => {
        const sizeKB = file.metadata?.size ? (file.metadata.size / 1024).toFixed(1) + ' KB' : '-';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="word-break: break-all;">${escapeHtml(file.name)}</td>
          <td>${sizeKB}</td>
          <td style="text-align: right; white-space: nowrap;">
            <button class="btn-download" onclick="downloadFile('${encodeURIComponent(file.name)}')">Download</button>
            <button class="btn-danger" onclick="deleteFile('${encodeURIComponent(file.name)}')">Delete</button>
          </td>
        `;
        fileList.appendChild(tr);
      });
    }

    // Download File
    async function downloadFile(encodedName) {
      const fileName = decodeURIComponent(encodedName);
      const filePath = `${currentUser.id}/${fileName}`;
      const { data, error } = await sb.storage.from(BUCKET_NAME).download(filePath);
      if (error) {
        alert('Download failed: ' + error.message);
        return;
      }
      const url = URL.createObjectURL(data);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // Delete File
    async function deleteFile(encodedName) {
      const fileName = decodeURIComponent(encodedName);
      if (!confirm(`Delete "${fileName}" permanently?`)) return;
      const filePath = `${currentUser.id}/${fileName}`;
      const { error } = await sb.storage.from(BUCKET_NAME).remove([filePath]);
      if (error) {
        alert('Delete failed: ' + error.message);
        return;
      }
      loadFiles();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    init();
  </script>
</body>
</html>
