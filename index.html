<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Portal | Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --navy: #0f172a;
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Corporate Header */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--navy);
      letter-spacing: -0.02em;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .nav-links span { cursor: default; }

    /* Main Content Area */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }
    .login-card h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      color: var(--navy);
      font-weight: 600;
    }
    .subtitle {
      margin: 0 0 28px;
      font-size: 0.92rem;
      color: var(--muted);
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.15s;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-full { width: 100%; margin-top: 4px; }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); padding: 6px 12px; font-size: 0.82rem; }
    .btn-download { padding: 6px 12px; font-size: 0.82rem; margin-right: 6px; }

    /* Authenticated Dashboard */
    .dashboard-container {
      width: 100%;
      max-width: 820px;
      align-self: flex-start;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .upload-box {
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background: #f8fafc;
      margin-bottom: 24px;
    }
    .status { margin-top: 10px; font-size: 0.88rem; color: var(--muted); }
    .error {
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-top: 14px;
      display: none;
    }

    /* Date Grouping Styles */
    .date-group {
      margin-bottom: 24px;
    }
    .date-group:last-child {
      margin-bottom: 0;
    }
    .date-header {
      background: #f1f5f9;
      color: var(--navy);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .date-count {
      font-weight: 400;
      color: var(--muted);
      font-size: 0.8rem;
    }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 11px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    .item-meta { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.82rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      .nav-links { display: none; }
      .hide-mobile { display: none; }
    }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION -->
  <header class="navbar">
    <div class="brand">
      <span class="brand-icon">W</span>
      <span>Northstar Workspace</span>
    </div>
    <div class="nav-links">
      <span>Overview</span>
      <span>Resources</span>
      <span>Support</span>
    </div>
  </header>

  <!-- MAIN VIEW -->
  <main class="main">
    <!-- GENERIC LOGIN SCREEN -->
    <div id="auth-card" class="login-card">
      <h1>Member Sign In</h1>
      <p class="subtitle">Enter your credentials to access your workspace.</p>
      <form id="login-form">
        <label for="email">Work Email</label>
        <input type="email" id="email" placeholder="name@organization.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />

        <button type="submit" id="login-btn" class="btn-full">Continue</button>
        <div id="auth-error" class="error"></div>
      </form>
    </div>

    <!-- AUTHENTICATED WORKSPACE SCREEN -->
    <div id="app-card" class="dashboard-container hidden">
      <div class="card">
        <div class="dash-header">
          <div>
            <h2 style="margin: 0 0 4px; font-size: 1.25rem; color: var(--navy);">Workspace Records</h2>
            <span id="user-email" style="color: var(--muted); font-size: 0.85rem;"></span>
          </div>
          <button id="logout-btn" class="btn-secondary">Sign Out</button>
        </div>

        <div class="upload-box">
          <input type="file" id="file-input" multiple style="margin-bottom: 12px;" />
          <br />
          <button id="upload-btn">Add Attachments</button>
          <div id="upload-status" class="status">Select one or more items to attach to this workspace.</div>
        </div>

        <!-- GROUPED RECORDS CONTAINER -->
        <div id="grouped-records">
          <div style="color: var(--muted); font-size: 0.9rem;">Loading records...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    &copy; 2026 Northstar Workspace. Authorized access only.
  </footer>

  <script>
    // =========================================================
    // REPLACE THESE TWO VALUES WITH YOUR SUPABASE CREDENTIALS
    // =========================================================
    const SUPABASE_URL = 'https://ralytkdpwrctlnbwfkli.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_U6czfrWsuJkhCD-o-YF45g_umKBfuJZ';
    const BUCKET_NAME = 'vault';
    // =========================================================

    const authCard = document.getElementById('auth-card');
    const appCard = document.getElementById('app-card');
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const authError = document.getElementById('auth-error');
    const userEmailEl = document.getElementById('user-email');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadStatus = document.getElementById('upload-status');
    const groupedRecords = document.getElementById('grouped-records');

    let sb = null;
    let currentUser = null;

    function showError(msg) {
      authError.textContent = msg;
      authError.style.display = 'block';
    }

    function init() {
      if (!SUPABASE_URL.startsWith('http') || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {
        showError('Configuration incomplete: Replace YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY in index.html.');
        return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      sb.auth.getSession().then(({ data: { session } }) => handleSession(session));
      sb.auth.onAuthStateChange((_event, session) => handleSession(session));
    }

    function handleSession(session) {
      if (session && session.user) {
        currentUser = session.user;
        userEmailEl.textContent = currentUser.email;
        document.title = 'Northstar Workspace';
        authCard.classList.add('hidden');
        appCard.classList.remove('hidden');
        loadFiles();
      } else {
        currentUser = null;
        document.title = 'Workspace Portal | Sign In';
        authCard.classList.remove('hidden');
        appCard.classList.add('hidden');
      }
    }

    // Login Handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.style.display = 'none';
      if (!sb) {
        showError('Supabase keys are not configured yet.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      loginBtn.disabled = false;
      loginBtn.textContent = 'Continue';

      if (error) {
        showError(error.message);
      }
    });

    // Logout Handler
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
    });

    // Upload Handler
    uploadBtn.addEventListener('click', async () => {
      const files = fileInput.files;
      if (!files.length) {
        uploadStatus.textContent = 'Please select at least one item first.';
        return;
      }
      uploadBtn.disabled = true;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        uploadStatus.textContent = `Processing (${i + 1}/${files.length}): ${file.name}...`;
        const filePath = `${currentUser.id}/${file.name}`;
        const { error } = await sb.storage.from(BUCKET_NAME).upload(filePath, file, {
          upsert: true
        });
        if (error) {
          uploadStatus.textContent = `Error: ${error.message}`;
          uploadBtn.disabled = false;
          return;
        }
      }
      uploadStatus.textContent = 'Completed.';
      fileInput.value = '';
      uploadBtn.disabled = false;
      loadFiles();
    });

    // Format Date Group Label (Today, Yesterday, or Full Date)
    function formatDateHeading(dateObj) {
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);

      const isSameDay = (a, b) =>
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();

      const formatted = dateObj.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      if (isSameDay(dateObj, today)) return `Today — ${formatted}`;
      if (isSameDay(dateObj, yesterday)) return `Yesterday — ${formatted}`;
      return formatted;
    }

    // List & Group Items by Upload Date
    async function loadFiles() {
      groupedRecords.innerHTML = '<div style="color: var(--muted); font-size: 0.9rem;">Loading records...</div>';
      const { data, error } = await sb.storage.from(BUCKET_NAME).list(currentUser.id, {
        limit: 500,
        sortBy: { column: 'created_at', order: 'desc' }
      });

      if (error) {
        groupedRecords.innerHTML = `<div style="color: var(--danger); font-size: 0.9rem;">${error.message}</div>`;
        return;
      }

      const validFiles = (data || []).filter(f => f.name !== '.emptyFolderPlaceholder');
      if (!validFiles.length) {
        groupedRecords.innerHTML = '<div style="color: var(--muted); font-size: 0.9rem;">No records found.</div>';
        return;
      }

      // Sort newest first using updated_at or created_at
      validFiles.sort((a, b) => {
        const dateA = new Date(a.updated_at || a.created_at || 0);
        const dateB = new Date(b.updated_at || b.created_at || 0);
        return dateB - dateA;
      });

      // Group by local calendar date
      const groups = new Map();
      validFiles.forEach(file => {
        const rawDate = file.updated_at || file.created_at;
        const dateObj = rawDate ? new Date(rawDate) : new Date();
        const heading = formatDateHeading(dateObj);
        if (!groups.has(heading)) groups.set(heading, []);
        groups.get(heading).push({ file, dateObj });
      });

      groupedRecords.innerHTML = '';
      groups.forEach((items, dateHeading) => {
        const section = document.createElement('div');
        section.className = 'date-group';

        const header = document.createElement('div');
        header.className = 'date-header';
        header.innerHTML = `
          <span>${escapeHtml(dateHeading)}</span>
          <span class="date-count">${items.length} ${items.length === 1 ? 'item' : 'items'}</span>
        `;
        section.appendChild(header);

        const table = document.createElement('table');
        const tbody = document.createElement('tbody');

        items.forEach(({ file, dateObj }) => {
          const sizeKB = file.metadata?.size ? formatSize(file.metadata.size) : '-';
          const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="word-break: break-all;">${escapeHtml(file.name)}</td>
            <td class="item-meta hide-mobile">${timeStr}</td>
            <td class="item-meta hide-mobile">${sizeKB}</td>
            <td style="text-align: right; white-space: nowrap;">
              <button class="btn-download" onclick="downloadFile('${encodeURIComponent(file.name)}')">Download</button>
              <button class="btn-danger" onclick="deleteFile('${encodeURIComponent(file.name)}')">Remove</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        section.appendChild(table);
        groupedRecords.appendChild(section);
      });
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    // Download Item
    async function downloadFile(encodedName) {
      const fileName = decodeURIComponent(encodedName);
      const filePath = `${currentUser.id}/${fileName}`;
      const { data, error } = await sb.storage.from(BUCKET_NAME).download(filePath);
      if (error) {
        alert('Download failed: ' + error.message);
        return;
      }
      const url = URL.createObjectURL(data);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // Delete Item
    async function deleteFile(encodedName) {
      const fileName = decodeURIComponent(encodedName);
      if (!confirm(`Remove "${fileName}"?`)) return;
      const filePath = `${currentUser.id}/${fileName}`;
      const { error } = await sb.storage.from(BUCKET_NAME).remove([filePath]);
      if (error) {
        alert('Remove failed: ' + error.message);
        return;
      }
      loadFiles();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    init();
  </script>
</body>
</html>
